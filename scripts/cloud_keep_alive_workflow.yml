# Optional 24/7 Cloud Keep-Alive & Position Monitor Workflow
# If you want GitHub Actions to run this automatically:
# 1. Generate a GitHub Personal Access Token with the 'workflow' scope.
# 2. Copy this file into .github/workflows/cloud_keep_alive.yml
# Or alternatively, use a free online cron (such as cron-job.org or UptimeRobot)
# to ping https://personal-ai-stock-backend.onrender.com/health every 10 minutes.

name: Cloud Keep-Alive & 24/7 Position Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Cloud Backend & Check Positions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Health Check Ping (Keep Container Warm)
        run: |
          echo "Pinging 24/7 Cloud Backend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 35 "https://personal-ai-stock-backend.onrender.com/health" || echo "FAILED")
          echo "Health Ping HTTP Status: $HTTP_CODE"

      - name: Trigger Real-Time Position Monitor & Auto-Sell Check
        run: |
          echo "Triggering auto-sell & position threshold checks..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 35 -X POST "https://personal-ai-stock-backend.onrender.com/api/v1/portfolio/auto-sell-check" || echo "FAILED")
          echo "Position Monitor Check HTTP Status: $HTTP_CODE"
