services:
  - type: web
    name: personal-ai-stock-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore # Closest free-tier region to Indian market (NSE)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/stock_intel.db
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD
        value: "SecureOwnerPass123!"
      - key: GEMINI_API_KEY
        value: ""
      - key: FCM_SERVICE_ACCOUNT_JSON
        value: ""
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: AUTO_SCAN_ENABLED
        value: "true"
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: SCAN_MARKET_HOURS_ONLY
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: NOTIFICATION_COOLDOWN_MINUTES
        value: "60"
      - key: GROWW_ORDER_EXECUTION_ENABLED
        value: "false"
      - key: ORDER_EXECUTION_MODE
        value: PAPER
